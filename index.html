<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Честный Кейс</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #1e1e28;
            --bg-card: #2a2a38; 
            --bg-panel: #16161d; 
            --text-main: #ffffff;
            --text-muted: #8b9bb4; 
            --accent: #6a5acd;
            --gold: #ffd700;
            --red: #ff4444;
            --green: #4caf50;
            --radius: 20px; 
            --purple: #a855f7;
        }
        body {
            margin: 0; padding: 0; background-color: var(--bg-main);
            color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none;
        }
        
        .glass-effect { position: relative; overflow: hidden; transition: transform 0.1s ease; }
        .glass-effect::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 0; height: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 40%, rgba(255,255,255,0) 70%);
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 50%;
            transform: translate(-50%, -50%); opacity: 0; pointer-events: none;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            transition: width 0.3s, height 0.3s, opacity 0.3s;
        }
        .glass-effect:active::after { width: 250%; height: 250%; opacity: 1; transition: width 0s, height 0s, opacity 0.1s; }
        .glass-effect:active { transform: scale(0.96); }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background-color: var(--bg-main); z-index: 10; }
        .logo-btn { font-size: 18px; font-weight: 900; color: #ffffff; text-transform: uppercase; letter-spacing: 1px; background: none; border: none; cursor: pointer; }
        .logo-btn span { color: var(--gold); font-weight: 600; }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .balance { background: var(--bg-card); padding: 8px 12px; border-radius: 15px; font-weight: bold; display: flex; gap: 5px; font-size: 15px; align-items: center;}
        .top-up-btn { background: linear-gradient(90deg, #6a5acd, #8a2be2); color: white; border: none; padding: 8px 15px; border-radius: 15px; font-weight: bold; font-size: 13px; cursor:pointer;}
        
        .screen { display: none; flex: 1; flex-direction: column; overflow-y: auto; }
        .screen.active { display: flex; }

        .case-list { padding: 15px; }
        .case-card { background: var(--bg-card); border-radius: var(--radius); padding: 20px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 15px; cursor: pointer; }
        .case-header { display: flex; align-items: center; gap: 15px; }
        .case-icon { font-size: 40px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 18px; }
        .case-icon img { width: 40px; height: 40px; object-fit: contain;}

        /* АПГРЕЙДЕР */
        .top-nav-case { display: flex; justify-content: space-between; padding: 15px; z-index: 10; }
        .icon-btn { background: var(--bg-card); border: none; color: white; padding: 12px 20px; border-radius: 15px; font-weight: bold; font-size: 14px; cursor: pointer;}
        .upgrader-container { padding: 0 15px 15px 15px; display: flex; flex-direction: column; align-items: center; width: 100%; box-sizing: border-box;}
        
        .wheel-wrapper { position: relative; width: 240px; height: 240px; margin: 20px 0; display: flex; justify-content: center; align-items: center; }
        .wheel-bg {
            width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(var(--green) 0deg, var(--green) calc(var(--chance) * 3.6deg), var(--red) calc(var(--chance) * 3.6deg), var(--red) 360deg);
            position: absolute; box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 20px rgba(0,0,0,0.5);
            border: 4px solid #2f2f3d; 
        }
        .wheel-inner { width: 70%; height: 70%; border-radius: 50%; background: var(--bg-card); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2; box-shadow: 0 0 10px rgba(0,0,0,0.8); }
        .wheel-inner-chance { font-size: 24px; font-weight: bold; color: var(--gold); }
        .wheel-inner-text { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
        
        .wheel-arrow {
            position: absolute; top: 50%; left: 50%; width: 4px; height: 50%;
            background: var(--gold); z-index: 10; transform-origin: bottom center;
            transform: translate(-50%, -100%) rotate(0deg);
            box-shadow: 0 0 10px var(--gold);
        }
        .wheel-arrow::before {
            content: ''; position: absolute; top: -10px; left: -6px;
            border-left: 8px solid transparent; border-right: 8px solid transparent;
            border-bottom: 15px solid var(--gold);
        }

        .upgrade-selectors { display: flex; gap: 10px; width: 100%; margin-bottom: 15px; align-items: stretch; }
        .selector-box { flex: 1; background: var(--bg-card); border-radius: 15px; padding: 15px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border: 2px solid transparent; min-height: 90px; position: relative;}
        .selector-box.active { border-color: var(--accent); }
        .selector-title { font-size: 11px; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; text-align: center;}
        .selector-content { font-size: 13px; font-weight: bold; text-align: center; display: flex; flex-direction: column; align-items: center;}
        .selector-img { width: 40px; height: 40px; object-fit: contain; margin-bottom: 5px;}

        .add-stars-btn {
            position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%);
            background: var(--accent); color: white; border: none; padding: 5px 10px;
            border-radius: 10px; font-size: 11px; font-weight: bold; cursor: pointer; display: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3); z-index: 5; white-space: nowrap;
        }

        .multipliers { display: flex; gap: 8px; width: 100%; margin-bottom: 20px; justify-content: space-between;}
        .mult-btn { flex: 1; background: var(--bg-card); border: none; color: white; padding: 12px 0; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s;}
        .mult-btn.active { background: var(--accent); }

        .btn-upgrade { width: 100%; background: linear-gradient(90deg, #6a5acd, #8a2be2); color: white; border: none; padding: 18px; border-radius: 15px; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: auto; box-shadow: 0 4px 15px rgba(138,43,226,0.3);}
        .btn-upgrade:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; }

        .modal-select { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 300; flex-direction: column; padding: 20px; box-sizing: border-box; animation: slideUp 0.3s ease-out; }
        .modal-select.active { display: flex; }
        .modal-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        .select-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; overflow-y: auto; padding-bottom: 20px;}
        .select-item { background: var(--bg-card); padding: 15px; border-radius: 15px; text-align: center; cursor: pointer; border: 2px solid transparent;}
